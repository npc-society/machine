name: Machine à clips

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min : lit tes réactions, monte les shorts (+ repérage à :07)
    - cron: "45 21 * * *"    # 22h45 (heure d'hiver de Paris) : récap du jour
    - cron: "0 17 * * 0"     # dimanche 18h : compilation de la semaine
  workflow_dispatch:
    inputs:
      action:
        description: "hunt = repérer · render = monter · compil = compilation"
        default: "hunt"
        type: choice
        options: [hunt, render, compil]

permissions:
  contents: write

concurrency:
  group: machine
  cancel-in-progress: false

env:
  TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
  TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CLIPS_FR: ${{ secrets.DISCORD_CLIPS_FR }}
  DISCORD_CLIPS_EN: ${{ secrets.DISCORD_CLIPS_EN }}
  DISCORD_MONTAGES_FR: ${{ secrets.DISCORD_MONTAGES_FR }}
  DISCORD_MONTAGES_EN: ${{ secrets.DISCORD_MONTAGES_EN }}
  DISCORD_CLIPS_ES: ${{ secrets.DISCORD_CLIPS_ES }}
  DISCORD_MONTAGES_ES: ${{ secrets.DISCORD_MONTAGES_ES }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GAME_NAMES: ${{ vars.GAME_NAMES || 'Grand Theft Auto VI' }}
  LANGS: ${{ vars.LANGS || 'fr,en' }}
  MIN_VIEWS: ${{ vars.MIN_VIEWS || '150' }}
  MIN_VIEWS_SMALL: ${{ vars.MIN_VIEWS_SMALL || '25' }}
  PER_RUN_BIG: ${{ vars.PER_RUN_BIG || '3' }}
  PER_RUN_SMALL: ${{ vars.PER_RUN_SMALL || '2' }}
  WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  machine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Que faire ?
        id: plan
        run: |
          S="${{ github.event.schedule }}"
          A="${{ github.event.inputs.action }}"
          HUNT=none; COMPIL=false
          if [ "$S" = "45 21 * * *" ]; then HUNT=daily
          elif [ "$S" = "0 17 * * 0" ] || [ "$A" = "compil" ]; then COMPIL=true
          elif [ "$A" = "hunt" ] || [ "$(date -u +%M)" -lt 30 ]; then HUNT=hunt
          fi
          echo "hunt=$HUNT" >> "$GITHUB_OUTPUT"
          echo "compil=$COMPIL" >> "$GITHUB_OUTPUT"

      - name: Repérage des clips
        if: steps.plan.outputs.hunt != 'none'
        run: python hunter.py ${{ steps.plan.outputs.hunt }}

      - name: Lecture de tes réactions Discord
        id: check
        run: python worker.py check

      - name: Outils de montage
        if: steps.check.outputs.queue != '0' || steps.plan.outputs.compil == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install faster-whisper yt-dlp "opencv-python-headless<5" numpy

      - name: Cache du modèle Whisper
        if: steps.check.outputs.queue != '0' || steps.plan.outputs.compil == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}

      - name: Montage des shorts
        if: steps.check.outputs.queue != '0'
        run: python worker.py render

      - name: Compilation de la semaine
        if: steps.plan.outputs.compil == 'true'
        run: python worker.py compil

      - name: Sauvegarde
        if: always()
        run: |
          git config user.name "machine-a-clips"
          git config user.email "machine-a-clips@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "maj $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
